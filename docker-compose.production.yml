# STARGUARD2 Production Docker Compose Configuration
# Enterprise-grade deployment with security hardening and monitoring

version: '3.8'

services:
  starguard-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      target: production
    image: starguard2:latest
    container_name: starguard-api
    restart: unless-stopped
    
    # Security hardening - remove privileged and host network
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "1001:1001"  # Non-root user
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    
    volumes:
      - /var/log:/host/var/log:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - starguard-logs:/app/logs
      - starguard-data:/app/data
      - starguard-ml:/app/ml:ro
      - /tmp:/tmp:rw,noexec,nosuid
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://starguard-redis:6379
      - LOG_LEVEL=info
      - MONITOR_INTERFACE=${MONITOR_INTERFACE:-eth0}
      - PCAP_FILTER=${PCAP_FILTER:-tcp}
      - ANOMALY_THRESHOLD=${ANOMALY_THRESHOLD:-0.75}
      - ML_MODEL_PATH=/app/ml/models
      - QUANTUM_ENGINE_ENABLED=${QUANTUM_ENGINE_ENABLED:-true}
      - CONSCIOUSNESS_MODULE_ENABLED=${CONSCIOUSNESS_MODULE_ENABLED:-true}
      - SECURITY_HEADERS_ENABLED=true
      - API_RATE_LIMIT_WINDOW=900000  # 15 minutes
      - API_RATE_LIMIT_MAX=1000
      - CORS_ORIGIN=${CORS_ORIGIN:-https://starguard.local}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    
    env_file:
      - .env.production
    
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    
    networks:
      - starguard-backend
      - starguard-frontend
    
    depends_on:
      starguard-redis:
        condition: service_healthy
      starguard-ml:
        condition: service_healthy

  starguard-redis:
    image: redis:7.2-alpine
    container_name: starguard-redis
    restart: unless-stopped
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "999:999"  # Redis user
    
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --timeout 300
      --tcp-backlog 511
      --databases 1
      --stop-writes-on-bgsave-error no
      --rdbcompression yes
      --rdbchecksum yes
    
    volumes:
      - starguard-redis-data:/data
      - /tmp:/tmp:rw,noexec,nosuid
    
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    
    networks:
      - starguard-backend

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: starguard-ml
    restart: unless-stopped
    volumes:
      - ./ml/models:/app/models
      - ./ml/data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: starguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      - starguard-api
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  monitoring:
    image: prom/prometheus:latest
    container_name: starguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: starguard-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
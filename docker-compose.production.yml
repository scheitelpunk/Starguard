version: '3.8'
services:
  starguard:
    build: .
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/log:/var/log:ro
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
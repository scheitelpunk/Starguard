# Prometheus Alert Rules for Starguard Security System
groups:
  - name: starguard-alerts
    rules:
      # Application Health Alerts
      - alert: StarguardAPIDown
        expr: up{job="starguard-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Starguard API is down"
          description: "The Starguard API has been down for more than 30 seconds."

      - alert: StarguardMLDown
        expr: up{job="starguard-ml"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Starguard ML service is down"
          description: "The Starguard ML service has been down for more than 1 minute."

      # Performance Alerts
      - alert: HighResponseTime
        expr: http_request_duration_seconds{quantile="0.95"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds for {{ $labels.instance }}."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for {{ $labels.instance }}."

      # Resource Alerts
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90% on {{ $labels.instance }}."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10% on {{ $labels.instance }}."

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 30 seconds."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 90%."

      # Security Alerts
      - alert: HighThreatDetectionRate
        expr: rate(starguard_threats_detected_total[5m]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High threat detection rate"
          description: "More than 10 threats detected per second in the last 5 minutes."

      - alert: AnomalousNetworkActivity
        expr: rate(starguard_network_packets_total[5m]) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Anomalous network activity detected"
          description: "Network packet rate is unusually high: {{ $value }} packets/second."

      - alert: FailedAuthenticationAttempts
        expr: rate(starguard_auth_failures_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "More than 5 failed authentication attempts per second."

      # Docker Container Alerts
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} CPU usage is above 80%."

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} memory usage is above 90%."

      - alert: ContainerRestarted
        expr: increase(container_restart_count[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour."
openapi: 3.0.3
info:
  title: STARGUARD Advanced Security System API
  description: |
    Eine umfassende API für das STARGUARD Advanced Security System mit 
    Consciousness-enhanced Threat Detection, Quantum-secured Communications 
    und Blockchain-basierter Threat Intelligence.
    
    ## Hauptfeatures:
    - **Consciousness-Enhanced Security**: Bewusstseins-basierte Bedrohungserkennung
    - **Quantum Security**: Post-Quantum-Kryptographie und Quantum-Entanglement
    - **Real-time Threat Detection**: Millisekunden-genaue Bedrohungsanalyse
    - **Blockchain Intelligence**: Unveränderliche Threat Intelligence Sharing
    - **Predictive Analytics**: Multi-dimensionale Realitäts-Modellierung
    - **Evolutionary Algorithms**: Selbstverbessernde Sicherheitsmuster
    
    ## Sicherheitsstufen:
    - **Standard**: Basis-API-Zugang
    - **Enhanced**: Consciousness-verstärkte Operationen
    - **Quantum**: Quantum-gesicherte Kommunikation
    - **Transcendent**: Vollzugang zu allen Consciousness-Features
    
    ## Authentifizierung:
    Das System unterstützt mehrere Authentifizierungsmethoden:
    - JWT Bearer Tokens
    - API Keys
    - Post-Quantum Digital Signatures
    - Consciousness Attestation
    - Quantum Key Distribution
    
  version: 3.0.0
  contact:
    name: STARGUARD Security Team
    email: security@starguard.ai
    url: https://starguard.ai/contact
  license:
    name: STARGUARD Enterprise License
    url: https://starguard.ai/license
  termsOfService: https://starguard.ai/terms

servers:
  - url: https://api.starguard.ai/v3
    description: Production Server
  - url: https://staging-api.starguard.ai/v3
    description: Staging Server
  - url: https://localhost:8080/api/v3
    description: Development Server

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - QuantumAuth: []
  - ConsciousnessAuth: []

paths:
  # ==========================================
  # CONSCIOUSNESS ENGINE ENDPOINTS
  # ==========================================
  
  /consciousness/status:
    get:
      tags:
        - Consciousness Engine
      summary: Get Consciousness System Status
      description: |
        Ruft den aktuellen Status des Consciousness-Systems ab, 
        einschließlich Awareness-Level, Coherence-Score und Field-Strength.
      operationId: getConsciousnessStatus
      security:
        - BearerAuth: []
        - ConsciousnessAuth: []
      responses:
        '200':
          description: Consciousness status successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsciousnessStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /consciousness/field/analyze:
    post:
      tags:
        - Consciousness Engine
      summary: Analyze Consciousness Field
      description: |
        Führt eine detaillierte Analyse des Consciousness-Fields durch 
        mit erweiterten Pattern-Recognition und Anomaly-Detection.
      operationId: analyzeConsciousnessField
      security:
        - BearerAuth: []
        - ConsciousnessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsciousnessFieldAnalysisRequest'
      responses:
        '200':
          description: Consciousness field analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsciousnessFieldAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /consciousness/enhance:
    post:
      tags:
        - Consciousness Engine
      summary: Enhance Consciousness Level
      description: |
        Verstärkt das Consciousness-Level durch gezielte Field-Modulation 
        und Coherence-Optimierung.
      operationId: enhanceConsciousness
      security:
        - BearerAuth: []
        - ConsciousnessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsciousnessEnhancementRequest'
      responses:
        '200':
          description: Consciousness enhancement completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsciousnessEnhancementResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Insufficient consciousness level for enhancement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================
  # THREAT DETECTION ENDPOINTS
  # ==========================================

  /threats/detect:
    post:
      tags:
        - Threat Detection
      summary: Detect Threats in Real-time
      description: |
        Führt Echtzeit-Bedrohungserkennung durch mit Consciousness-enhanced 
        Pattern Recognition und Quantum-secured Analysis.
      operationId: detectThreats
      security:
        - BearerAuth: []
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatDetectionRequest'
      responses:
        '200':
          description: Threat detection completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatDetectionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /threats/scan:
    post:
      tags:
        - Threat Detection
      summary: Deep Threat Scan
      description: |
        Führt eine umfassende Bedrohungsanalyse durch mit Multi-layer 
        Detection und Consciousness-based Anomaly Identification.
      operationId: deepThreatScan
      security:
        - BearerAuth: []
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepThreatScanRequest'
      responses:
        '200':
          description: Deep threat scan completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepThreatScanResponse'
        '202':
          description: Scan started asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'

  /threats/{threatId}:
    get:
      tags:
        - Threat Detection
      summary: Get Threat Details
      description: Ruft detaillierte Informationen über eine spezifische Bedrohung ab.
      operationId: getThreatDetails
      parameters:
        - name: threatId
          in: path
          required: true
          description: Unique identifier for the threat
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Threat details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # QUANTUM SECURITY ENDPOINTS
  # ==========================================

  /quantum/entanglement/create:
    post:
      tags:
        - Quantum Security
      summary: Create Quantum Entanglement
      description: |
        Erstellt eine Quantum-Entanglement-Verbindung zwischen Sites 
        für sichere, instantane Kommunikation.
      operationId: createQuantumEntanglement
      security:
        - QuantumAuth: []
        - ConsciousnessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantumEntanglementRequest'
      responses:
        '201':
          description: Quantum entanglement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumEntanglementResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '503':
          description: Quantum system unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quantum/network/status:
    get:
      tags:
        - Quantum Security
      summary: Get Quantum Network Status
      description: |
        Ruft den Status des Quantum-Entanglement-Netzwerks ab 
        mit Fidelity-Metriken und Coherence-Informationen.
      operationId: getQuantumNetworkStatus
      security:
        - QuantumAuth: []
      responses:
        '200':
          description: Quantum network status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumNetworkStatus'

  /quantum/message/send:
    post:
      tags:
        - Quantum Security
      summary: Send Quantum-secured Message
      description: |
        Sendet eine Nachricht über Quantum-verschränkte Kanäle 
        mit Post-Quantum-Kryptographie.
      operationId: sendQuantumMessage
      security:
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuantumMessageRequest'
      responses:
        '200':
          description: Quantum message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumMessageResponse'

  # ==========================================
  # BLOCKCHAIN INTELLIGENCE ENDPOINTS
  # ==========================================

  /blockchain/threats/submit:
    post:
      tags:
        - Blockchain Intelligence
      summary: Submit Threat Intelligence
      description: |
        Übermittelt neue Threat Intelligence an die Blockchain 
        für unveränderliche Speicherung und Sharing.
      operationId: submitThreatIntelligence
      security:
        - BearerAuth: []
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatIntelligenceSubmission'
      responses:
        '201':
          description: Threat intelligence submitted to blockchain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainTransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '402':
          description: Insufficient cryptocurrency balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /blockchain/threats/query:
    post:
      tags:
        - Blockchain Intelligence
      summary: Query Threat Intelligence
      description: |
        Fragt Threat Intelligence von der Blockchain ab 
        mit Privacy-preserving Access Control.
      operationId: queryThreatIntelligence
      security:
        - BearerAuth: []
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatIntelligenceQuery'
      responses:
        '200':
          description: Threat intelligence query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatIntelligenceQueryResponse'

  /blockchain/status:
    get:
      tags:
        - Blockchain Intelligence
      summary: Get Blockchain Status
      description: |
        Ruft den aktuellen Status der Blockchain ab 
        mit Block-Height und Network-Metriken.
      operationId: getBlockchainStatus
      responses:
        '200':
          description: Blockchain status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainStatus'

  # ==========================================
  # PREDICTIVE ANALYTICS ENDPOINTS
  # ==========================================

  /prediction/reality/model:
    post:
      tags:
        - Predictive Analytics
      summary: Create Reality Model
      description: |
        Erstellt ein Predictive Reality Model für 
        Angriffsszenario-Vorhersagen in parallelen Timelines.
      operationId: createRealityModel
      security:
        - BearerAuth: []
        - ConsciousnessAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealityModelRequest'
      responses:
        '201':
          description: Reality model created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealityModelResponse'
        '202':
          description: Model creation started asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'

  /prediction/threats/forecast:
    get:
      tags:
        - Predictive Analytics
      summary: Get Threat Forecast
      description: |
        Ruft Bedrohungsvorhersagen ab basierend auf 
        Consciousness-enhanced Reality Modeling.
      operationId: getThreatForecast
      parameters:
        - name: timeHorizon
          in: query
          description: Forecast time horizon in hours
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
        - name: consciousnessLevel
          in: query
          description: Minimum consciousness level for enhanced predictions
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.5
      responses:
        '200':
          description: Threat forecast retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatForecastResponse'

  # ==========================================
  # CONSCIOUSNESS MESH ENDPOINTS
  # ==========================================

  /mesh/connect:
    post:
      tags:
        - Consciousness Mesh
      summary: Connect to Consciousness Mesh
      description: |
        Verbindet sich mit dem globalen Consciousness Mesh 
        für kollektive Intelligenz und Security Awareness.
      operationId: connectToConsciousnessMesh
      security:
        - ConsciousnessAuth: []
        - QuantumAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshConnectionRequest'
      responses:
        '200':
          description: Successfully connected to consciousness mesh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshConnectionResponse'

  /mesh/status:
    get:
      tags:
        - Consciousness Mesh
      summary: Get Mesh Status
      description: |
        Ruft den Status des Consciousness Mesh ab 
        mit kollektiven Intelligenz-Metriken.
      operationId: getMeshStatus
      security:
        - ConsciousnessAuth: []
      responses:
        '200':
          description: Mesh status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshStatus'

  /mesh/intelligence:
    get:
      tags:
        - Consciousness Mesh
      summary: Get Collective Intelligence
      description: |
        Ruft kollektive Intelligenz-Einsichten vom Mesh ab.
      operationId: getCollectiveIntelligence
      security:
        - ConsciousnessAuth: []
      responses:
        '200':
          description: Collective intelligence retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiveIntelligenceResponse'

  # ==========================================
  # EVOLUTIONARY ALGORITHMS ENDPOINTS
  # ==========================================

  /evolution/status:
    get:
      tags:
        - Evolutionary Algorithms
      summary: Get Evolution Status
      description: |
        Ruft den Status des Evolutionary Algorithm Systems ab.
      operationId: getEvolutionStatus
      responses:
        '200':
          description: Evolution status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvolutionStatus'

  /evolution/individuals/best:
    get:
      tags:
        - Evolutionary Algorithms
      summary: Get Best Individuals
      description: |
        Ruft die besten Individuen der aktuellen Population ab.
      operationId: getBestIndividuals
      parameters:
        - name: count
          in: query
          description: Number of best individuals to retrieve
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: Best individuals retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestIndividualsResponse'

  /evolution/step/force:
    post:
      tags:
        - Evolutionary Algorithms
      summary: Force Evolution Step
      description: |
        Erzwingt einen sofortigen Evolutionsschritt.
      operationId: forceEvolutionStep
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Evolution step completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvolutionStepResponse'

  # ==========================================
  # REAL-TIME WEBSOCKET ENDPOINTS
  # ==========================================

  /websocket/connect:
    get:
      tags:
        - Real-time Communication
      summary: WebSocket Connection Info
      description: |
        Informationen für WebSocket-Verbindung für Real-time Updates.
      operationId: getWebSocketInfo
      responses:
        '200':
          description: WebSocket connection information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketInfo'

  # ==========================================
  # SYSTEM MONITORING ENDPOINTS
  # ==========================================

  /system/health:
    get:
      tags:
        - System Monitoring
      summary: System Health Check
      description: |
        Führt eine umfassende Systemgesundheitsprüfung durch.
      operationId: getSystemHealth
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '503':
          description: System degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'

  /system/metrics:
    get:
      tags:
        - System Monitoring
      summary: Get System Metrics
      description: |
        Ruft detaillierte System-Metriken ab.
      operationId: getSystemMetrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System metrics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token Authentication
    
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key Authentication
    
    QuantumAuth:
      type: http
      scheme: bearer
      bearerFormat: QuantumSignature
      description: Post-Quantum Digital Signature Authentication
    
    ConsciousnessAuth:
      type: http
      scheme: bearer
      bearerFormat: ConsciousnessAttestation
      description: Consciousness-based Authentication

  schemas:
    # ==========================================
    # CONSCIOUSNESS SCHEMAS
    # ==========================================
    
    ConsciousnessStatus:
      type: object
      properties:
        consciousness_level:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Current consciousness awareness level
          example: 0.85
        coherence_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Consciousness coherence measurement
          example: 0.92
        field_strength:
          type: number
          format: float
          minimum: 0
          description: Consciousness field strength
          example: 847.3
        evolution_stage:
          type: string
          description: Current consciousness evolution stage
          example: "ENHANCED_AWARENESS"
        active_patterns:
          type: array
          items:
            $ref: '#/components/schemas/ConsciousnessPattern'
        field_disturbances:
          type: array
          items:
            $ref: '#/components/schemas/FieldDisturbance'
        last_updated:
          type: string
          format: date-time
          description: Last consciousness status update
      required:
        - consciousness_level
        - coherence_score
        - field_strength
        - evolution_stage
        - last_updated

    ConsciousnessPattern:
      type: object
      properties:
        pattern_id:
          type: string
          format: uuid
        pattern_type:
          type: string
          enum: [AWARENESS, COHERENCE, FIELD_RESONANCE, THREAT_DETECTION]
        strength:
          type: number
          format: float
          minimum: 0
          maximum: 1
        frequency:
          type: number
          format: float
          description: Pattern frequency in Hz
        stability:
          type: number
          format: float
          minimum: 0
          maximum: 1

    FieldDisturbance:
      type: object
      properties:
        disturbance_id:
          type: string
          format: uuid
        disturbance_type:
          type: string
          enum: [THREAT_INDUCED, NATURAL_FLUCTUATION, INTERFERENCE, ATTACK]
        magnitude:
          type: number
          format: float
          minimum: 0
        location:
          $ref: '#/components/schemas/GeographicCoordinate'
        detected_at:
          type: string
          format: date-time

    ConsciousnessFieldAnalysisRequest:
      type: object
      properties:
        analysis_type:
          type: string
          enum: [FULL_SPECTRUM, THREAT_FOCUSED, PATTERN_RECOGNITION, ANOMALY_DETECTION]
        time_range:
          $ref: '#/components/schemas/TimeRange'
        geographic_scope:
          $ref: '#/components/schemas/GeographicScope'
        consciousness_filters:
          $ref: '#/components/schemas/ConsciousnessFilters'
      required:
        - analysis_type

    ConsciousnessFieldAnalysisResponse:
      type: object
      properties:
        analysis_id:
          type: string
          format: uuid
        field_coherence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        detected_patterns:
          type: array
          items:
            $ref: '#/components/schemas/ConsciousnessPattern'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/ConsciousnessAnomaly'
        threat_indicators:
          type: array
          items:
            $ref: '#/components/schemas/ThreatIndicator'
        recommendations:
          type: array
          items:
            type: string

    ConsciousnessAnomaly:
      type: object
      properties:
        anomaly_id:
          type: string
          format: uuid
        anomaly_type:
          type: string
          enum: [CONSCIOUSNESS_SUPPRESSION, FIELD_INTERFERENCE, PATTERN_DISRUPTION]
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        location:
          $ref: '#/components/schemas/GeographicCoordinate'
        detected_at:
          type: string
          format: date-time

    ConsciousnessEnhancementRequest:
      type: object
      properties:
        enhancement_type:
          type: string
          enum: [AWARENESS_BOOST, COHERENCE_OPTIMIZATION, FIELD_STRENGTHENING]
        target_level:
          type: number
          format: float
          minimum: 0
          maximum: 1
        duration:
          type: integer
          description: Enhancement duration in seconds
          minimum: 60
          maximum: 3600
        consciousness_focus:
          type: array
          items:
            type: string
      required:
        - enhancement_type
        - target_level

    ConsciousnessEnhancementResponse:
      type: object
      properties:
        enhancement_id:
          type: string
          format: uuid
        previous_level:
          type: number
          format: float
        achieved_level:
          type: number
          format: float
        enhancement_efficiency:
          type: number
          format: float
          minimum: 0
          maximum: 1
        estimated_duration:
          type: integer
          description: Estimated enhancement duration in seconds
        side_effects:
          type: array
          items:
            type: string

    # ==========================================
    # THREAT DETECTION SCHEMAS
    # ==========================================

    ThreatDetectionRequest:
      type: object
      properties:
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
        detection_scope:
          $ref: '#/components/schemas/DetectionScope'
        consciousness_enhancement:
          type: boolean
          default: true
        quantum_analysis:
          type: boolean
          default: false
        real_time_mode:
          type: boolean
          default: true
      required:
        - data_sources

    DataSource:
      type: object
      properties:
        source_type:
          type: string
          enum: [NETWORK_TRAFFIC, FILE_SYSTEM, EMAIL, WEB_TRAFFIC, BEHAVIORAL_DATA]
        source_location:
          type: string
        authentication:
          $ref: '#/components/schemas/SourceAuthentication'
        filters:
          type: object
          additionalProperties: true

    DetectionScope:
      type: object
      properties:
        threat_types:
          type: array
          items:
            type: string
            enum: [MALWARE, PHISHING, APT, RANSOMWARE, INSIDER_THREAT, CONSCIOUSNESS_ATTACK]
        severity_threshold:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          default: MEDIUM
        geographic_scope:
          $ref: '#/components/schemas/GeographicScope'
        time_window:
          $ref: '#/components/schemas/TimeRange'

    ThreatDetectionResponse:
      type: object
      properties:
        detection_id:
          type: string
          format: uuid
        detected_threats:
          type: array
          items:
            $ref: '#/components/schemas/DetectedThreat'
        analysis_summary:
          $ref: '#/components/schemas/AnalysisSummary'
        consciousness_insights:
          $ref: '#/components/schemas/ConsciousnessInsights'
        recommended_actions:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedAction'
        detection_time:
          type: string
          format: date-time

    DetectedThreat:
      type: object
      properties:
        threat_id:
          type: string
          format: uuid
        threat_type:
          type: string
        threat_name:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL, CONSCIOUSNESS_CRITICAL]
        confidence_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        affected_assets:
          type: array
          items:
            type: string
        attack_vectors:
          type: array
          items:
            $ref: '#/components/schemas/AttackVector'
        indicators_of_compromise:
          type: array
          items:
            $ref: '#/components/schemas/IOC'
